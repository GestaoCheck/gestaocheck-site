# WebP automático (14/09/2026, auditoria) - todo PNG/JPG de
# `assets/sistema/`+`assets/equipe/` ganhou um `.webp` irmão
# (gerado com `sharp`, ~60% menor em média, mesma resolução/qualidade
# visual - conferido lado a lado) - em vez de reescrever toda tag
# `<img>`/`<picture>` do site (são dezenas, muitas com a lógica de
# `data-src` dos popups de módulo), o nginx entrega o `.webp` sozinho
# pra quem o navegador aceita (`Accept: image/webp`, todo navegador
# atual) e cai pro `.png`/`.jpg` original em qualquer outro caso - zero
# mudança de HTML/JS, o `<img src="...png">` continua exatamente igual
# no código, só a resposta HTTP muda. Se um dia um PNG/JPG novo entrar
# sem o `.webp` irmão, o `try_files` cai pro arquivo original sozinho -
# nunca quebra por WebP faltando.
map $http_accept $webp_suffix {
    default          "";
    "~*image/webp"   ".webp";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Compressao gzip (14/09/2026, achado da 2a auditoria - nunca tinha
    # sido ligada) - só texto (html/css/js/svg/json), nunca formatos já
    # comprimidos (png/jpg/webp/mp4/webm/gif - comprimir de novo só
    # gasta CPU à toa, o ganho é zero ou negativo). Medido com gzip -9
    # nos arquivos reais do site: CSS -79%, JS -67% a -76%, HTML -82% -
    # maior ganho de peso que qualquer outra coisa feita até agora,
    # e sem risco nenhum (gzip é suporte universal em todo navegador,
    # já vem no modulo padrao do nginx, nao precisa de nada extra).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml+rss application/atom+xml image/svg+xml application/ld+json;

    # Cabecalhos de seguranca - site estatico, sem formulario/backend, mas
    # esses headers reduzem a superficie de ataque mesmo assim (clickjacking,
    # MIME sniffing, vazamento de referrer, embed indevido em iframe).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # 'sha256-Hik4Z...' libera SÓ o bloco JSON-LD (dados estruturados,
    # <script type="application/ld+json"> no <head> do index.html) - é
    # o único inline script do site, então em vez de 'unsafe-inline'
    # (que liberaria QUALQUER script inline, inclusive um injetado por
    # ataque) o CSP permite só esse conteúdo exato, pelo hash dele.
    # ATENÇÃO: se o conteúdo desse bloco mudar (mesmo só formatação/
    # espaço), o hash muda e o CSP passa a bloquear ele silenciosamente
    # (sem erro visível pro usuário, só warning no console) - recalcular
    # com: node -e "const c=require('fs').readFileSync('index.html','utf8').match(/<script type=\"application\/ld\+json\">([\s\S]*?)<\/script>/)[1];console.log('sha256-'+require('crypto').createHash('sha256').update(c,'utf8').digest('base64'))"
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Hik4ZOnvqIaPQNPIUbdc7/wbZO9OShT49w8Ej3iQWkc=' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'self';" always;
    # HSTS (14/09/2026, auditoria) - o Traefik já termina TLS com
    # Let's Encrypt (ver docker-compose.yml, entrypoint "websecure"),
    # mas quem garante "sempre HTTPS, nunca mais tenta HTTP de novo" pro
    # navegador é esse header, na origem - não é responsabilidade do
    # proxy. `preload` não incluído de propósito (entrar na lista de
    # preload do Chrome é praticamente irreversível por meses - não
    # ativar sem decisão explícita).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # PNG/JPG - entrega o .webp irmão pra quem aceita (ver `map` no topo
    # do arquivo); `Vary: Accept` avisa qualquer cache intermediário
    # (CDN, proxy) que a resposta muda dependendo desse header, pra
    # nunca servir WebP pra quem não pediu ou vice-versa. `(.+)` captura
    # o caminho SEM a extensão - `$uri$webp_suffix` (tentativa errada,
    # achada testando com container real) viraria "arquivo.png.webp",
    # que não existe. **Segundo bug real, achado no mesmo teste**: só
    # trocar pra `$1$webp_suffix` não bastou - `$1` sempre chegava
    # vazio no `try_files`, mesmo o regex do location batendo certinho.
    # Causa: variável de `map` é avaliada "lazy" (só quando referenciada
    # pela primeira vez) - `$webp_suffix` só é resolvida aqui dentro,
    # nesse exato ponto, e resolver ela dispara o regex do `map`
    # ("~*image/webp") - QUALQUER regex avaliado depois do regex do
    # location (mesmo sem capturar nada) sobrescreve `$1` do nginx pra
    # vazio. `set $img_base $1;` logo na entrada do bloco "congela" o
    # valor capturado numa variável própria ANTES do `map` ter chance
    # de rodar e apagar `$1` - só assim funciona de verdade. Confirmado
    # com container real rodando (`docker build`+`docker run`+`curl`
    # com `Accept: image/webp` vs sem), não só lendo o arquivo.
    location ~* ^/(.+)\.(?:png|jpe?g)$ {
        set $img_base $1;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept";
        try_files /$img_base$webp_suffix $uri =404;
    }

    location ~* \.(?:svg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fragmentos HTML da vitrine (demo/*.frag, demo/screens/*.frag): a extensao
    # NAO e .html de proposito - o Live Server do VS Code injeta seu script de
    # live-reload em todo .html/.svg e corrompia os fragmentos. text/plain entra
    # no gzip_types; o `?v=<hash>` do runtime torna o cache longo seguro.
    location ~* \.frag$ {
        default_type text/plain;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # .mp4/.webm (14/09/2026) - o GIF do Multi-IA virou vídeo (2,2MB
    # -> 172KB/125KB, ~92% menor, ver comentário na tag <video> em
    # index.html) - sem essa regra ficava na mesma situação que o GIF
    # tinha antes (sem cache-control nenhum).
    location ~* \.(?:mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # CSS/JS já usam query string de versao (`?v=N`) pra invalidar cache
    # quando o conteudo muda (ver `<script src="script.js?v=4">` etc.) -
    # com isso, cache agressivo aqui e seguro: mudou o arquivo, o proprio
    # HTML que o referencia muda a URL junto, forcando buscar de novo.
    # Antes disso, cada visita revalidava via 304 mesmo sem o arquivo
    # ter mudado - agora o navegador nem chega a perguntar pro servidor.
    location ~* \.(?:css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
