server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Cabecalhos de seguranca - site estatico, sem formulario/backend, mas
    # esses headers reduzem a superficie de ataque mesmo assim (clickjacking,
    # MIME sniffing, vazamento de referrer, embed indevido em iframe).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; base-uri 'self'; frame-ancestors 'self';" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:svg|jpg|jpeg|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
